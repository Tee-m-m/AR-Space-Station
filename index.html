<!DOCTYPE html> 
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Futuristic Space Exploration Station</title>

        <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
        <link rel="stylesheet" href="css/style.css">

        <script src="js/status-banner.js"></script>
        <script src="js/color-change.js"></script>
        <script src="js/grow-on-tap.js"></script>
        <script src="js/planets.js"></script>
        <script src="js/rocket.js"></script>
        <script src="js/model.js"></script>
        <script src="js/extras.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">

        <div id="status-banner" class="searching">Point the camera at the Hiro Marker</div>

        <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
            <a-marker preset="hiro" id="hiro-marker" status-banner="target: #status-banner">
                <a-cylinder id="platform" radius="0.8" height="0.1" position="0 0.05 0" color="#2C3E50"></a-cylinder>

                <a-entity planets></a-entity>
                <a-entity rocket></a-entity>
                <a-entity astronaut-model></a-entity>
                <a-entity extras></a-entity>
            </a-marker>

            <a-entity camera cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable"></a-entity>

        </a-scene>

    </body>
</html>
